[priority]
order = [
  "StoryData/*.json"
]

[keyword_shorthands]
regex = "\\[(?P<keyword_id>\\w+):`(?P<text>.*?)`\\](\\((?P<color>#[a-fA-F0-9]{6})?(;(?P<sprite_id>\\w+))?(?P<cancel_link>:nolink)?\\))?"
regex_tuple = "\\[@Tuple\\((?P<keyword_ids>.*?)\\):`(?P<text>.*?)`\\]\\((?P<color>#[a-fA-F0-9]{6})\\)"
regex_small_hints = "\\[@Hint\\((?P<keyword_id>\\w+)\\):`(?P<text>.*?)`\\]"
apply_for = [
  "Skills*.json",
  "Passive*.json",
  "EGOgift_*.json",
  "PanicInfo*.json",
  "BuffAbilities.json",
  "MentalCondition*.json",
  "BattleKeywords*.json",
  "Bufs*.json",
  "BattleResultHint-*.json",
  "UI_Mission_MirrorDungeon*Event.json",
  "RPGSystem/rpg-loc-item-common-*.json"
]

# Потому что в скиллах и пассивках нельзя свободно ставить квадратные скобки, только через SkillTag.json с ухищрениями
[illegal_square_brackets_tweak]
regex = "\\[@SquareBrackets:`(?P<text>.*?)`\\](\\((?P<color>#[a-fA-F0-9]{6})?\\))?"
open_skilltag  = "WHITE"
close_skilltag = "BLACK"
# В итоге должна получиться мешанина из тегов с квадратными скобками, вставленными из
# скилл тега, в которой цвет из ?P<color> наложен на скобки и ?P<text> используя механизмы
# TMPro с сохранением тега на фоне, если он идёт сквозь такой же.
# (То есть: "<color=#e30000>Красный, <color=#f8c200>Жёлтый</color>, всё ещё Красный</color>")
#
# Значением для open_skilltag должно быть "</color>[", а для close_skilltag "</color>]"
#
# Например:
#
#  Внутри SkillTag.json:
#   {
#     "id": "WHITE",
#     "name": "</color>["
#   },
#   {
#     "id": "BLACK",
#     "name": "</color>]"
#   },
#
#   Исходный текст используя illegal_square_brackets_tweak:
#     [@SquareBrackets:`Неизменной`](#ffa600)
#
#   Текст после билда когда replace_illegal_square_brackets() из text.py отработал:
#     <color=#ffa600>[WHITE]<color=#ffa600>Неизменной[BLACK]
#
#   В игре после автоматического раскрытия ею тегов [WHITE] и [BLACK] (<color=#ffffff>/<color=#444444> перед значением "name" и </color> после автоматически вставлены самой игрой)
#     <color=#ffa600><color=#ffffff></color>[</color><color=#ffa600>Неизменной<color=#444444></color>]</color>

# no_link = [
#   "BattleKeywords*.json",
#   "Bufs*.json",
#   "PanicInfo*.json",
# ]

[xml_escape]
singular_keywords = [
  "sprite",
  "style",
  "align",
  "size",
  "line-height",
  "pos"
]
