[font]
repo = "kimght/LimbusFonts"
# local path if repo is not set, else asset name in repo releases
replacement_map_path = "replacement_map.json"

[[font.include]]
path = "Context/Context.ttf"
filename = "Context.ttf"

[[font.include]]
path = "Title/Title.ttf"
filename = "Title.ttf"

[reference]
repo = "x1bViolet/Limbus-Localization-Files"
branch = "English"
path = ""

[rpg]
dialogue_files = [
  "RPGSystem/rpg-loc-dialogue-floor-1.json",
  "RPGSystem/rpg-loc-dialogue-floor-2.json",
  "RPGSystem/rpg-loc-dialogue-floor-3.json",
  "RPGSystem/rpg-loc-dialogue-floor-4.json",
  "RPGSystem/rpg-loc-dialogue-floor-b1.json",
  "RPGSystem/rpg-loc-dialogue-floor-b2.json",
  "RPGSystem/rpg-loc-dialogue-route-a.json",
  "RPGSystem/rpg-loc-dialogue-common-a1c10p1.json",

  "RPGSystem/rpg-loc-dialogue-floor-1-b.json",
  "RPGSystem/rpg-loc-dialogue-floor-2-b.json",
  "RPGSystem/rpg-loc-dialogue-floor-3-b.json",
  "RPGSystem/rpg-loc-dialogue-floor-4-b.json",
  "RPGSystem/rpg-loc-dialogue-floor-5-b.json",
  "RPGSystem/rpg-loc-dialogue-floor-b1-b.json",
  "RPGSystem/rpg-loc-dialogue-floor-b2-b.json",
  "RPGSystem/rpg-loc-dialogue-floor-b3-b.json",
  "RPGSystem/rpg-loc-dialogue-route-b.json",
  "RPGSystem/rpg-loc-dialogue-common-a1c10p2.json",

  "RPGSystem/rpg-loc-dialogue-floor-1-c1.json",
  "RPGSystem/rpg-loc-dialogue-floor-1-c2.json",
  "RPGSystem/rpg-loc-dialogue-floor-2-c1.json",
  "RPGSystem/rpg-loc-dialogue-floor-2-c2.json",
  "RPGSystem/rpg-loc-dialogue-floor-3-c2.json",
  "RPGSystem/rpg-loc-dialogue-floor-4-c2.json",
  "RPGSystem/rpg-loc-dialogue-floor-5-c2.json",
  "RPGSystem/rpg-loc-dialogue-floor-7-c2.json",
  "RPGSystem/rpg-loc-dialogue-route-c.json",
  "RPGSystem/rpg-loc-dialogue-route-c2.json",
  "RPGSystem/rpg-loc-dialogue-common-a1c10p3.json",
]

[[font_rules."Enemies*.json"]]
font = "bebas"
path = '$.dataList[*].name'

[[font_rules."AbEvents*.json"]]
font = "bebas"
path = '$.dataList[*].prevDesc'

[[font_rules."StageChapterText*.json"]]
font = "bebas"
path = '$.dataList[*].company'

[[font_rules."StageChapterText*.json"]]
font = "bebas"
path = '$.dataList[*].area'

[[font_rules."StageChapterText*.json"]]
font = "bebas"
path = '$.dataList[*].chapter'

[[font_rules."SeasonTitle.json"]]
font = "bebas"
path = '$.dataList[*].content'

[[font_rules."RailwayDungeon.json"]]
font = "bebas"
path = '$.dataList[*].name'

[[font_rules."Ch8VideoEffectSettings.json"]]
font = "mikodacs"
path = '$.dataList[*].texts[*].texts[*].text'

[[close_highlight]]
file_pattern = "Skills.json"
path = "$.dataList[*].levelList[*].coinlist[*].coindescs[*].desc"

[[close_highlight]]
file_pattern = "Skills.json"
path = "$.dataList[*].levelList[*].desc"

[[close_highlight]]
file_pattern = "Skills_Ego.json"
path = "$.dataList[*].levelList[*].coinlist[*].coindescs[*].desc"

[[close_highlight]]
file_pattern = "Skills_Ego.json"
path = "$.dataList[*].levelList[*].desc"

[[close_highlight]]
file_pattern = "Skills_Ego_Personality-*.json"
path = "$.dataList[*].levelList[*].coinlist[*].coindescs[*].desc"

[[close_highlight]]
file_pattern = "Skills_Ego_Personality-*.json"
path = "$.dataList[*].levelList[*].desc"

[[close_highlight]]
file_pattern = "Skills_personality-*.json"
path = "$.dataList[*].levelList[*].coinlist[*].coindescs[*].desc"

[[close_highlight]]
file_pattern = "Skills_personality-*.json"
path = "$.dataList[*].levelList[*].desc"

[priority]
order = [
  "StoryData/*.json"
]

[keyword_shorthands]
regex = "\\[(?P<keyword_id>\\w+):`(?P<text>.*?)`\\](\\((?P<color>#[a-fA-F0-9]{6})?(;(?P<sprite_id>\\w+))?\\))?"
apply_for = [
  "Skills*.json",
  "Passive*.json",
  "EGOgift_*.json",
  "PanicInfo*.json",
  "BuffAbilities.json",
  "MentalCondition*.json",
  "BattleKeywords*.json",
  "Bufs*.json",
  "BattleResultHint-*.json",
  "UI_Mission_MirrorDungeon*Event.json",
  "RPGSystem/rpg-loc-item-common-*.json"
]

# no_link = [
#   "BattleKeywords*.json",
#   "Bufs*.json",
#   "PanicInfo*.json",
# ]

[xml_escape]
singular_keywords = [
  "sprite",
  "style",
  "align",
  "size",
  "line-height"
]
